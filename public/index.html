<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fyll burken</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/index.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body data-page="start">
    <a class="skip-link" href="#main">Hoppa till innehållet</a>

    <main id="main">
      <section
        id="start-view"
        class="start"
        aria-labelledby="start-heading"
      >
        <div class="start__content">
          <p class="pill">Vardagsquiz</p>
          <h1 id="start-heading">Fyll burken.</h1>
          <p class="start__intro">
            Snabba frågor om världen omkring oss. Varje rätt svar blir ett fack
            i burken – hur full blir din?
          </p>

          <dl class="facts">
            <div class="facts__item">
              <dt>Frågor</dt>
              <dd>10</dd>
            </div>
            <div class="facts__item">
              <dt>Tid per fråga</dt>
              <dd>30 sek</dd>
            </div>
            <div class="facts__item">
              <dt>Ämnen</dt>
              <dd>Blandat</dd>
            </div>
          </dl>

          <form id="start-form" class="start__form">
            <label for="player-name" class="visually-hidden">Namn</label>
            <input
              type="text"
              id="player-name"
              name="playerName"
              placeholder="skriv ditt namn här"
              autocomplete="given-name"
              maxlength="30"
              required
            />
            <button type="submit" id="start-button" class="button">
              Starta quiz <span aria-hidden="true">→</span>
            </button>
            <p class="start__hint">eller tryck Enter</p>
          </form>

          <button
            type="button"
            id="resume-button"
            class="button button--secondary"
            hidden
          >
            Fortsätt påbörjat quiz
          </button>
        </div>

        <div class="jar">
          <img src="assets/img/score-jar-2.png" alt="" />
        </div>
      </section>
    </main>
  </body>
</html>
