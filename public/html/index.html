<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fyll burken</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/kevins-test.css" />
    <script type="module" src="../js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Hoppa till innehållet</a>

    <main id="main">
      <section
        id="start-view"
        class="view start"
        aria-labelledby="start-heading"
      >
        <div class="start__content">
          <p class="pill">Vardagsquiz</p>
          <h1 id="start-heading">Fyll burken.</h1>
          <p class="start__intro">
            Snabba frågor om världen omkring oss. Varje rätt svar blir ett fack
            i burken – hur full blir din?
          </p>

          <dl class="facts">
            <div class="facts__item">
              <dt>Frågor</dt>
              <dd>10</dd>
            </div>
            <div class="facts__item">
              <dt>Tid per fråga</dt>
              <dd>20 sek</dd>
            </div>
            <div class="facts__item">
              <dt>Ämnen</dt>
              <dd>Geografi, Rymden</dd>
            </div>
          </dl>

          <form id="start-form" class="start__form">
            <label for="player-name" class="visually-hidden">Namn</label>
            <input
              type="text"
              id="player-name"
              name="playerName"
              placeholder="skriv ditt namn här"
              autocomplete="given-name"
              maxlength="30"
              required
            />
            <button type="submit" id="start-button" class="button">
              Starta quiz <span aria-hidden="true">→</span>
            </button>
            <p class="start__hint">eller tryck Enter</p>
          </form>

          <button
            type="button"
            id="resume-button"
            class="button button--secondary"
            hidden
          >
            Fortsätt påbörjat quiz
          </button>
        </div>

        <!-- Burken är dekoration, 10 fack = 10 frågor. JS lägger till klassen "jar__slot--filled" -->
        <div class="jar" aria-hidden="true">
          <div class="jar__lid"></div>
          <div class="jar">
            <img src="../assets/img/score-jar-2.png" alt="" />
          </div>
        </div>
      </section>

      <section
        id="question-view"
        class="view"
        aria-labelledby="question-heading"
        hidden
      >
        <h2 id="question-heading" tabindex="-1">
          Fråga <span id="question-number"></span> av
          <span id="question-total"></span>
        </h2>
        <p>Tid kvar: <span id="timer" role="timer">20</span> sek</p>

        <form id="answer-form">
          <fieldset>
            <legend id="question-text"></legend>
            <div id="options"></div>
          </fieldset>
          <button type="submit" class="button">Svara</button>
        </form>

        <p id="feedback" aria-live="polite"></p>
      </section>

      <section
        id="result-view"
        class="view"
        aria-labelledby="result-heading"
        hidden
      >
        <h2 id="result-heading" tabindex="-1">Ditt resultat</h2>
        <p id="score-text"></p>
        <p id="feedback-text"></p>
        <button type="button" id="restart-button" class="button">
          Spela igen
        </button>

        <h3>Tidigare resultat</h3>
        <ol id="result-history"></ol>
      </section>

      <p id="error-message" role="alert" hidden></p>
    </main>
  </body>
</html>
